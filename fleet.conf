# fleet.conf - app manifest. Sourced (as shell) by the lifecycle scripts
# (bin/run bin/start bin/restart bin/reload bin/stop). $PORT is available
# inside every command. An empty command skips that step.

NAME="Angular Template"
PORT="3000"
HEALTH_PATH="/"

INSTALL_CMD='npm install'
BUILD_CMD='npm run build'
START_CMD='npx serve -s dist/angular/browser -l $PORT'
RELOAD_CMD=''

# The app serves at the root (/) of its own hostname.
